    From s012 final review (M-new-1). internal/amqp/consumer.go Dial fails once and Start returns; main logs and the goroutine exits -> usage-service runs gRPC-only with ingestion permanently dead (no reconnect on later drop either). photo-service (rabbitmq-bus.ts) and media-worker (rabbitmq.py) retry the INITIAL connect with backoff; usage-service should match (initial-connect retry + a supervised restart loop). Compose gates on rabbitmq service_healthy so boot is fine; this hardens against broker restarts. No-reconnect-on-drop is an accepted repo-wide limitation (separate concern).

