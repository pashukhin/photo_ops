description: |-
    From s020 final /code-review. PostEditor 'Copy share text' builds shareText({title, body, slug}) from the LIVE editable title/body state, not the last-published values. If the owner edits the title/body after publishing without Saving, then clicks Copy share text, the copied text diverges from the public /posts/<slug> page (which shows the saved post). Low severity (unusual edit-after-publish-without-save sequence; localhost demo unaffected). Fix needs tracking the published/saved title+body separately (extra state) and a test. Consider snapshotting the post at load/save/publish.

    (migrated from beads photo_ops-7x5)
