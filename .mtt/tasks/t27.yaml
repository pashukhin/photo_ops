description: |-
    Owner feedback (s012 add-on review): RAM consumption of an operation should be billed as byte_seconds — the integral of memory used over the operation's duration — self-measured by the operation runtime (same mechanism as the cpu_seconds task). Emitted as resource=memory / unit=byte_second. Pricing resolves $/byte_second. See ADR-0004 raw-unit seam.

