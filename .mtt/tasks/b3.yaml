description: |-
    scripts/testguard/cli.py _git_blob does 'git show ref:path' with text=True; a tracked binary file (e.g. a vendored .gz) in the changed set raises UnicodeDecodeError and crashes the whole gate. Fix: errors='replace' (a binary file has no test declarations, so it should decode to harmless garbage) or skip binary blobs. Surfaced in session 022 (vendored GeoNames data — worked around by shipping plain .tsv instead of .gz).

